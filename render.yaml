# Render Blueprint — single unified web service for the R Garage app.
#
#   App + API (root) → rgarage-web
#
# Both the Next.js UI and all /api/* routes run in the same Node.js process,
# eliminating cross-service HTTP hops, double cold starts, and BACKEND_URL
# sync issues. A single cron ping to /health keeps the entire app awake.
#
# The database stays an external managed MySQL (Aiven's free plan
# recommended): Render has no MySQL of its own. Apply this file with
# Dashboard → New + → Blueprint → select this repo; Render prompts for the
# `sync: false` values below (DB_HOST, DB_PORT, DB_PASSWORD, DB_SSL_CA).

services:
  - type: web
    name: rgarage-web
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm ci && npm run build
    # npm start checks schema compatibility before starting Next.js. Back up and
    # migrate explicitly before deploying; the app never runs a historical data
    # repair at boot.
    startCommand: npm start
    # /health is a cheap LIVENESS check (no database access). Keep it that way:
    # do not point this at /ready, or a database outage would make Render
    # restart a perfectly healthy server. /ready exists for manual diagnosis.
    healthCheckPath: /health
    envVars:
      # External managed MySQL. Prompted once, on first apply.
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_USER
        value: avnadmin
      - key: DB_PASSWORD
        sync: false
      # Managed providers require TLS; DB_SSL_CA is the provider's ca.pem
      # (PEM text — real newlines or \n escapes both work).
      - key: DB_SSL
        value: "true"
      - key: DB_SSL_CA
        sync: false
      # Aiven's free plan pre-creates `defaultdb`; change if you made your own.
      - key: DB_NAME
        value: defaultdb
      - key: AUTH_SECRET
        generateValue: true
      - key: APP_TIME_ZONE
        value: Asia/Manila
      - key: NODE_ENV
        value: production
