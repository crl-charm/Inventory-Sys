# Render Blueprint — creates both services for the R Garage app.
#
#   API  (backend/)  →  rgarage-api
#   UI   (frontend/) →  rgarage-web
#
# The database stays an external managed MySQL (Aiven's free plan
# recommended): Render has no MySQL of its own. Apply this file with
# Dashboard → New + → Blueprint → select this repo; Render prompts for the
# `sync: false` values below (DB_HOST, DB_PORT, DB_PASSWORD, DB_SSL_CA).
#
# The two services point at each other through RENDER_EXTERNAL_URL, so
# BACKEND_URL and FRONTEND_ORIGIN stay correct even if Render appends a
# suffix to a service URL. See README → "Render (optional — online
# deployment)" for the manual walkthrough and Aiven setup.

services:
  # --- API (backend/) -------------------------------------------------------
  - type: web
    name: rgarage-api
    runtime: node
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      # External managed MySQL. Prompted once, on first apply.
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_USER
        value: avnadmin
      - key: DB_PASSWORD
        sync: false
      # Managed providers require TLS; DB_SSL_CA is the provider's ca.pem
      # (PEM text — real newlines or \n escapes both work).
      - key: DB_SSL
        value: "true"
      - key: DB_SSL_CA
        sync: false
      # Aiven's free plan pre-creates `defaultdb`; change if you made your own.
      - key: DB_NAME
        value: defaultdb
      - key: AUTH_SECRET
        generateValue: true
      - key: APP_TIME_ZONE
        value: Asia/Manila
      # HTTPS cookies → Secure; the app's local default HOST is 127.0.0.1
      # (LAN-only), so a public host must opt in.
      - key: NODE_ENV
        value: production
      - key: HOST
        value: "0.0.0.0"
      # CSRF allowlist: only the UI service may call mutating APIs.
      - key: FRONTEND_ORIGIN
        fromService:
          name: rgarage-web
          type: web
          envVarKey: RENDER_EXTERNAL_URL

  # --- UI (frontend/) -------------------------------------------------------
  - type: web
    name: rgarage-web
    runtime: node
    region: singapore
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: BACKEND_URL
        fromService:
          name: rgarage-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: APP_TIME_ZONE
        value: Asia/Manila
